name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ejournal
          POSTGRES_USER: ejournal
          POSTGRES_PASSWORD: ejournal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ejournal -d ejournal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: "pyproject.toml"

      - name: Sync deps
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest
        env:
          DB_NAME: ejournal
          DB_USER: ejournal
          DB_PASSWORD: ejournal
          DB_HOST: 127.0.0.1

      - name: Migration drift
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Production configuration
        run: uv run python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-123456789
          JWT_SECRET: ci-only-jwt-secret-with-more-than-fifty-characters-987654321
          DB_PASSWORD: ci-only-database-password-4827
          DB_HOST: 127.0.0.1

      - name: Compose configuration
        run: docker compose config --quiet
        env:
          SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-123456789
          JWT_SECRET: ci-only-jwt-secret-with-more-than-fifty-characters-987654321
          DB_PASSWORD: ci-only-database-password-4827

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Docker Login
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: frozendevs/tfoms-ejournal:latest
