name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: ejournal
          POSTGRES_USER: ejournal
          POSTGRES_PASSWORD: ejournal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ejournal -d ejournal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: "pyproject.toml"

      - name: Sync deps
        run: uv sync --frozen

      - name: Install pip for pip-audit
        run: uv pip install --python .venv pip

      - name: Audit Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          virtual-environment: .venv
          vulnerability-service: osv

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: JavaScript syntax
        run: |
          node --check scripts/visual_qa.mjs
          find static/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Tests (pytest)
        run: uv run pytest
        env:
          DB_NAME: ejournal
          DB_USER: ejournal
          DB_PASSWORD: ejournal
          DB_HOST: 127.0.0.1

      - name: Migration drift
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Production configuration
        run: uv run python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-123456789
          JWT_SECRET: ci-only-jwt-secret-with-more-than-fifty-characters-987654321
          DB_NAME: ejournal
          DB_USER: ejournal
          DB_PASSWORD: ci-only-database-password-4827
          DB_HOST: 127.0.0.1
          ALLOWED_HOSTS: localhost,127.0.0.1
          TRUSTED_PROXY_IPS: 127.0.0.1/32,::1/128

      - name: Compose configuration
        run: docker compose config --quiet
        env:
          VCS_REF: ${{ github.sha }}
          SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-123456789
          JWT_SECRET: ci-only-jwt-secret-with-more-than-fifty-characters-987654321
          DB_NAME: ejournal
          DB_USER: ejournal
          DB_PASSWORD: ci-only-database-password-4827
          DB_HOST: 127.0.0.1
          ALLOWED_HOSTS: localhost,127.0.0.1
          TRUSTED_PROXY_IPS: 127.0.0.1/32,::1/128

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check registry credentials
        id: registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo >&2 "Docker Hub credentials are required for main releases"
              exit 1
            fi
          fi

      - name: Docker Login
        if: github.ref == 'refs/heads/main' && steps.registry.outputs.available == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          load: true
          push: false
          build-args: VCS_REF=${{ github.sha }}
          tags: |
            frozendevs/tfoms-ejournal:${{ github.sha }}
            frozendevs/tfoms-ejournal:latest

      - name: Verify runtime image
        env:
          CONTAINER_ENGINE: docker
        run: >-
          sh scripts/container_runtime_gate.sh
          frozendevs/tfoms-ejournal:${{ github.sha }}
          ${{ github.sha }}

      - name: Build deployment bundle
        run: |
          mkdir -p dist
          sh scripts/package_deployment_bundle.sh \
            "${{ github.sha }}" \
            "dist/ofoms-ejournal-deploy-${{ github.sha }}.tar.gz"

      - name: Publish deployment bundle
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ofoms-ejournal-deploy-${{ github.sha }}
          path: dist/ofoms-ejournal-deploy-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Push verified runtime image
        if: github.ref == 'refs/heads/main' && steps.registry.outputs.available == 'true'
        run: |
          docker push frozendevs/tfoms-ejournal:${{ github.sha }}
          docker push frozendevs/tfoms-ejournal:latest
