x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"

x-app-build: &app-build
  context: .
  args:
    VCS_REF: ${VCS_REF:?VCS_REF must be the full Git commit SHA}

x-app-security: &app-security
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=256m,mode=1777

services:
  volume-init:
    image: docker.io/frozendevs/tfoms-ejournal:${VCS_REF:?VCS_REF must be the full Git commit SHA}
    build: *app-build
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    command: ["sh", "-c", "chown -R 10001:10001 /app/media /app/exchange"]
    volumes:
      - media:/app/media
      - exchange:/app/exchange
    restart: "no"
    logging: *default-logging

  web:
    <<: *app-security
    image: docker.io/frozendevs/tfoms-ejournal:${VCS_REF:?VCS_REF must be the full Git commit SHA}
    build: *app-build
    init: true
    command: [".venv/bin/gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "60"]
    environment: &web_env
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:-5432}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      ALLOW_INSECURE_DB_CONNECTION: ${ALLOW_INSECURE_DB_CONNECTION:-false}
      DB_SSLROOTCERT: ${DB_SSLROOTCERT:-}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-4}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-3}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-3}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ejournal}
      JWT_TTL: ${JWT_TTL:-300}
      TOKEN_LOGIN_TRUSTED_ORIGINS: ${TOKEN_LOGIN_TRUSTED_ORIGINS:-}
      ACCOUNT_REPOSITORY_BACKEND: ${ACCOUNT_REPOSITORY_BACKEND:-local}
      ACCOUNT_REPOSITORY_URL: ${ACCOUNT_REPOSITORY_URL:-}
      ACCOUNT_REPOSITORY_TOKEN: ${ACCOUNT_REPOSITORY_TOKEN:-}
      ACCOUNT_REPOSITORY_TIMEOUT: ${ACCOUNT_REPOSITORY_TIMEOUT:-5}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      DEBUG: "False"
      MAX_FAILED_LOGIN_ATTEMPTS: ${MAX_FAILED_LOGIN_ATTEMPTS:-10}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      SESSION_COOKIE_AGE: ${SESSION_COOKIE_AGE:-28800}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      TRUST_PROXY_SSL_HEADER: ${TRUST_PROXY_SSL_HEADER:-True}
      TRUST_PROXY_CLIENT_IP_HEADER: ${TRUST_PROXY_CLIENT_IP_HEADER:-True}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:?TRUSTED_PROXY_IPS is required}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      TASK_STALE_AFTER_SECONDS: ${TASK_STALE_AFTER_SECONDS:-3600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - media:/app/media
      - exchange:/app/exchange
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    depends_on:
      volume-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - >-
          import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=3);
          c.request('GET','/readyz',headers={'X-Forwarded-Proto':'https'}); r=c.getresponse();
          sys.exit(0 if r.status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 75s
    logging: *default-logging

  migrate:
    <<: *app-security
    image: docker.io/frozendevs/tfoms-ejournal:${VCS_REF:?VCS_REF must be the full Git commit SHA}
    build: *app-build
    command:
      - sh
      - -c
      - >-
        if [ "$${ALLOW_LEGACY_INPLACE_UPGRADE:-false}" = "true" ]; then
        .venv/bin/python manage.py upgrade_legacy_database
        --confirm upgrade-journal-v1-in-place; fi &&
        .venv/bin/python manage.py production_db_preflight &&
        .venv/bin/python manage.py migrate --noinput
    environment:
      <<: *web_env
      ALLOW_LEGACY_INPLACE_UPGRADE: ${ALLOW_LEGACY_INPLACE_UPGRADE:-false}
    restart: "no"
    logging: *default-logging

  db-tools:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    profiles: ["ops"]
    environment:
      PGDATABASE: ${DB_NAME:?DB_NAME is required}
      PGUSER: ${DB_USER:?DB_USER is required}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGHOST: ${DB_HOST:?DB_HOST is required}
      PGPORT: ${DB_PORT:-5432}
      PGSSLMODE: ${DB_SSLMODE:-require}
      PGSSLROOTCERT: ${DB_SSLROOTCERT:-}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging: *default-logging

  scheduler:
    <<: *app-security
    image: docker.io/frozendevs/tfoms-ejournal:${VCS_REF:?VCS_REF must be the full Git commit SHA}
    build: *app-build
    init: true
    command: [".venv/bin/python", "manage.py", "run_scheduler", "--interval", "60"]
    environment: *web_env
    volumes:
      - media:/app/media
      - exchange:/app/exchange
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 75s
    logging: *default-logging

volumes:
  media:
  exchange:
