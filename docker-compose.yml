services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ejournal}
      POSTGRES_USER: ${DB_USER:-ejournal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ejournal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "
        .venv/bin/python manage.py migrate --noinput --settings config.settings.prod &&
        .venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
      "
    environment: &web_env
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_NAME: ${DB_NAME:-ejournal}
      DB_USER: ${DB_USER:-ejournal}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: "5432"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DEBUG: "False"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      TRUST_PROXY_SSL_HEADER: ${TRUST_PROXY_SSL_HEADER:-True}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      TASK_STALE_AFTER_SECONDS: ${TASK_STALE_AFTER_SECONDS:-3600}
    volumes:
      - media:/app/media
      - exchange:/app/exchange
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - >-
          import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=3);
          c.request('GET','/healthz'); r=c.getresponse(); sys.exit(0 if r.status in (200,301,302) else 1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  scheduler:
    build: .
    command: >
      sh -c "while true; do .venv/bin/python manage.py run_tasks; sleep 60; done"
    environment: *web_env
    volumes:
      - media:/app/media
      - exchange:/app/exchange
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  media:
  exchange:
