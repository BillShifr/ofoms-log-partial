# ---------------------------------------------------------------------------
# ИС «Единый электронный журнал обращений граждан» v2 — ТФОМС ХМАО — Югры
# Проектная конфигурация (uv / pyproject). Django 5.2 LTS, Python 3.13.
# Версии зафиксированы на дату старта 07.09.2026 (сверка с PyPI).
# ---------------------------------------------------------------------------
[project]
name = "ejournal-portal-tfoms"
version = "2.0.0"
description = "Единый электронный журнал обращений граждан (v2) для ТФОМС ХМАО — Югры"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "ТФОМС ХМАО — Югры / Разработчик" }]
dependencies = [
    # Web-фреймворк: Django 5.2 LTS (последний патч 5.2.17, поддержка до апреля 2028)
    "Django==5.2.17",
    # СУБД PostgreSQL: psycopg 3 (актуальный драйвер) + пул соединений
    "psycopg[binary]==3.3.5",
    "psycopg-pool==3.3.1",
    # WSGI-сервер и статика
    "gunicorn==26.2.0",
    "whitenoise==6.12.0",
    # Парсинг/валидация XML (XSD-контроль)
    "lxml==6.1.3",
    # Excel: импорт обращений и выгрузка отчётов
    "openpyxl==3.1.5",
    # Сквозная авторизация: временные токены
    "PyJWT==2.13.0",
    # Админка: диапазон-фильтры, выпадающие фильтры, импорт/экспорт
    "django-admin-rangefilter==0.15.0",
    "django-admin-list-filter-dropdown==1.0.3",
    "django-import-export==4.4.1",
    # Транслит (формирование username при импорте users*.xml)
    "pytils==0.4.4",
    # Конфигурация окружения
    "python-dotenv==1.2.3",
    "reportlab==5.0.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.6",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "coverage>=7.16.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps", "config"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "apps"]
