[project]
name = "ejournal-portal-tfoms"
version = "2.0.0"
description = "Единый электронный журнал обращений граждан (v2) для ТФОМС ХМАО — Югры"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "ТФОМС ХМАО — Югры / Разработчик" }]
dependencies = [
    "Django==5.2.17",
    "psycopg[binary]==3.3.5",
    "psycopg-pool==3.3.1",
    "gunicorn==26.2.0",
    "whitenoise==6.12.0",
    "lxml==6.1.3",
    "openpyxl==3.1.5",
    "PyJWT==2.13.0",
    "django-admin-rangefilter==0.15.0",
    "django-admin-list-filter-dropdown==1.0.3",
    "django-import-export==4.4.1",
    "pytils==0.4.4",
    "python-dotenv==1.2.3",
    "reportlab==5.0.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.6",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "coverage>=7.16.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-q"

[tool.uv]
# приложение запускается без сборки wheel
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps", "config"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "apps"]
