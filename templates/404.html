{% extends "base.html" %}

{% block title %}Страница не найдена{% endblock %}

{% block content %}
<section class="error-page" aria-labelledby="error-title">
  <div class="error-page__card">
    <div class="error-page__code" aria-hidden="true">404</div>
    <h1 class="error-page__title" id="error-title">Страница не найдена</h1>
    <p class="error-page__text">Возможно, адрес изменился или ссылка устарела. Проверьте адрес либо продолжите работу с обращениями.</p>
    <div class="error-page__actions">
      <a class="btn btn--primary" href="{% url 'journal:list' %}">Перейти к обращениям</a>
      <button class="btn btn--ghost" type="button" data-ui-action="back">Вернуться назад</button>
    </div>
  </div>
</section>
{% endblock %}
